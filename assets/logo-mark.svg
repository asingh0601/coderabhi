<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 44" width="62" height="44" role="img" aria-label="coderabhi">
  <title>coderabhi</title>
  <!-- An uptime trace ending in a terminal cursor: the line stays alive, and
       the cursor is still blinking. No monogram to decode. -->
  <style>
    @keyframes blink { 0%,45% { opacity: 1 } 50%,95% { opacity: .18 } 100% { opacity: 1 } }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation: blink 1.15s steps(1, end) infinite }
    }
  </style>
  <path d="M4 28H14L20 10L27 38L32 20L36 28H42" fill="none" stroke="#6c9bff"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="48" y="14" width="10" height="20" rx="3" fill="#57cf9a"/>
</svg>
